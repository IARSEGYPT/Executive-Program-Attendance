<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101B2E;
    --paper:#F6F3EC;
    --brass:#AE8A52;
    --brass-soft:#DDC9A0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:32px;
    font-family:'Inter',sans-serif;
  }
  .wrap{
    max-width:560px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
  }
  .emblem{width:96px;height:96px;}
  .emblem circle, .emblem path{
    fill:none;
    stroke:var(--brass);
    stroke-width:1.4;
  }
  .emblem .ring-outer{
    stroke-dasharray:283;
    stroke-dashoffset:283;
    animation:draw 1.4s ease forwards;
  }
  .emblem .ring-inner{
    stroke-dasharray:170;
    stroke-dashoffset:170;
    animation:draw 1.1s ease forwards .3s;
    opacity:0;
    animation-fill-mode:forwards;
  }
  .emblem .spark{
    stroke-dasharray:40;
    stroke-dashoffset:40;
    animation:draw .8s ease forwards 1.1s;
    opacity:0;
    animation-fill-mode:forwards;
  }
  @keyframes draw{
    0%{opacity:1;}
    100%{stroke-dashoffset:0;opacity:1;}
  }
  .text{
    opacity:0;
    transform:translateY(10px);
    animation:rise .9s ease forwards 1.3s;
  }
  @keyframes rise{
    to{opacity:1;transform:translateY(0);}
  }
  .kicker{
    font-size:12.5px;
    color:var(--brass-soft);
    margin:0 0 14px;
  }
  .text p{
    font-family:'Fraunces',serif;
    font-weight:300;
    font-size:clamp(20px,4.5vw,26px);
    line-height:1.5;
    color:var(--paper);
    margin:0;
  }
  .begin{
    font-weight:500;
    color:var(--brass-soft);
  }
  @media (prefers-reduced-motion:reduce){
    .emblem .ring-outer,.emblem .ring-inner,.emblem .spark,.text{
      animation:none !important;
      opacity:1 !important;
      stroke-dashoffset:0 !important;
      transform:none !important;
    }
  }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="emblem" viewBox="0 0 100 100">
      <circle class="ring-outer" cx="50" cy="50" r="45"/>
      <circle class="ring-inner" cx="50" cy="50" r="30"/>
      <path class="spark" d="M50 32 L54 47 L69 50 L54 53 L50 68 L46 53 L31 50 L46 47 Z"/>
    </svg>
    <div class="text">
      <p class="kicker" id="day-label">Checked in</p>
      <p>Welcome, and thank you for joining us.<br>
      We look forward to an insightful, engaging, and impactful learning experience designed to inspire new perspectives, strengthen leadership, and create meaningful impact.<br>
      <span class="begin">Let's begin.</span></p>
    </div>
  </div>

  <script>
    // ===== JSONBIN.IO — same bin as the admin dashboard =====
    const JSONBIN_ID = "6a9952ffda38895dfe336dbb";
    const JSONBIN_MASTER_KEY = "$2a$10$LoRD9kcNy3g/BxdyIss8ZOWV/Sj6Ry.EQUlIR4VqMxDKpoIONbStW";
    const JSONBIN_BASE = `https://api.jsonbin.io/v3/b/${JSONBIN_ID}`;

    const dayLabelEl = document.getElementById('day-label');
    const params = new URLSearchParams(window.location.search);
    const dayOverride = params.get('day');

    async function recordAttendance(){
      try {
        // 1) Read current shared state
        const res = await fetch(`${JSONBIN_BASE}/latest`, {
          headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
        });
        if (!res.ok) throw new Error(`Status ${res.status}`);
        const data = await res.json();
        const record = data.record || {};

        // 2) Work out which day this scan counts for:
        //    an explicit ?day= in the link wins, otherwise fall back to
        //    whichever day the coordinator has marked active on the dashboard.
        const day = dayOverride || record.activeDay || 1;

        dayLabelEl.textContent = `Day ${day} · Checked in`;

        // 3) Mark that day attended and write the whole record back
        const attendance = Object.assign({1:false,2:false,3:false,4:false,5:false,6:false}, record.attendance || {});
        attendance[day] = true;

        const updated = Object.assign({}, record, { attendance });

        await fetch(JSONBIN_BASE, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': JSONBIN_MASTER_KEY
          },
          body: JSON.stringify(updated)
        });
      } catch (err) {
        // Still show the welcome screen even if the write fails — a learner
        // scanning shouldn't be blocked by a network hiccup.
        console.error('Could not record attendance:', err);
        if (dayOverride) dayLabelEl.textContent = `Day ${dayOverride} · Checked in`;
      }
    }

    recordAttendance();
  </script>
</body>
</html>
